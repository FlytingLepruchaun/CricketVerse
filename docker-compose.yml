version: '3.8'

services:
  db:
    image: mysql:8.0
    container_name: cricketverse_mysql
    restart: always
    environment:
      MYSQL_ROOT_PASSWORD: rootpassword
      MYSQL_DATABASE: cricketverse
    ports:
      - "3306:3306"
    volumes:
      - db_data:/var/lib/mysql
      - ./database/schema.sql:/docker-entrypoint-initdb.d/init.sql
    healthcheck:
      test: ["CMD", "mysqladmin", "ping", "-h", "localhost", "-u", "root", "-prootpassword"]
      interval: 5s
      timeout: 5s
      retries: 10

  web:
    build:
      context: .
      dockerfile: Dockerfile
    container_name: cricketverse_app
    restart: always
    environment:
      FLASK_ENV: production
      FLASK_PORT: 5000
      FLASK_HOST: 0.0.0.0
      DB_HOST: db
      DB_PORT: 3306
      DB_NAME: cricketverse
      DB_USER: root
      DB_PASSWORD: rootpassword
      SECRET_KEY: cricketverse-docker-production-secret-2026
      JWT_SECRET: cricketverse-docker-jwt-secret-2026
    ports:
      - "5000:5000"
    depends_on:
      db:
        condition: service_healthy

volumes:
  db_data:
